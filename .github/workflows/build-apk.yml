name: Build Afra Home Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract project files
        run: |
          unzip -q AfraHomeManager-project.zip -d source
          cd source/AfraHomeManager
          npm install
          npx cap add android

      - name: Build APK
        run: |
          cd source/AfraHomeManager/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: AfraHomeManager-APK
          path: source/AfraHomeManager/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
